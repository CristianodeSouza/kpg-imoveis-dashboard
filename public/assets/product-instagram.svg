<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Instagram">
  <defs>
    <linearGradient id="ig-bg" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#405de6"/>
      <stop offset=".32" stop-color="#833ab4"/>
      <stop offset=".62" stop-color="#e1306c"/>
      <stop offset=".82" stop-color="#fd1d1d"/>
      <stop offset="1" stop-color="#fcb045"/>
    </linearGradient>
    <radialGradient id="ig-glow" cx="70%" cy="16%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1230" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="url(#ig-bg)"/>
  <rect width="900" height="520" fill="url(#ig-glow)"/>
  <circle cx="120" cy="450" r="190" fill="#fff" opacity=".08"/>
  <circle cx="780" cy="80" r="170" fill="#fff" opacity=".12"/>
  <g filter="url(#soft-shadow)" opacity=".96">
    <rect x="330" y="125" width="240" height="240" rx="62" fill="none" stroke="#fff" stroke-width="26"/>
    <circle cx="450" cy="245" r="56" fill="none" stroke="#fff" stroke-width="26"/>
    <circle cx="523" cy="172" r="18" fill="#fff"/>
  </g>
  <g opacity=".22">
    <rect x="80" y="94" width="120" height="120" rx="32" fill="#fff"/>
    <rect x="706" y="315" width="86" height="86" rx="24" fill="#fff"/>
    <circle cx="250" cy="390" r="24" fill="#fff"/>
  </g>
</svg>
